<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Kert | Portfólio</title>
</head>

<body>

    <main class="container">

        <!-- Seção Principal / Perfil -->
        <section class="inicio">
            <img src="image.webp" alt="Foto de perfil" class="foto-perfil">

            <h1>Kert</h1>

            <p class="descricao">
                Olá, sou o Kert, um artista independente, sou criador do estúdio de projetos artísticos Starroll Studios.
            </p>
        </section>

        <!-- Galeria de Artes -->
        <section class="galeria-container">
            <h2>Minhas Artes</h2>

            <div class="galeria-grid">
                <div class="arte-item">
                    <img src="estela2.png" alt="Desenho Estela 2">
                </div>
                <div class="arte-item">
                    <img src="ralsei.png" alt="Desenho Ralsei">
                </div>
                <div class="arte-item">
                    <img src="quinter.png" alt="Desenho Quinter">
                </div>
                <div class="arte-item">
                    <img src="july.png" alt="Desenho July">
                </div>
            </div>
        </section>

    </main>

</body>

</html>
